[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "wesza-mcp"
version = "0.1.0"
description = "Deploy and manage apps on Wesza from Claude, Cursor, or Windsurf"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
wesza-mcp = "wesza_mcp.server:main_sync"

[project.urls]
Homepage = "https://wesza.online"
Repository = "https://github.com/wesza-online/wesza-mcp"
